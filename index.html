<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guitare</title>
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Accords, exercices et banque de morceaux pour apprendre la guitare, hors connexion.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guitare">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Retour" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="title">Accords</h1>
      <div class="topbar-actions" id="topActions"></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Sauvegarde et réglages">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 17v2.5A1.5 1.5 0 005.5 21h13a1.5 1.5 0 001.5-1.5V17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" role="tablist">
      <button class="tab active" data-tab="chords" role="tab">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 8h14M5 12.5h14M5 17h14M9.7 3v18M14.3 3v18" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="9.7" cy="10.2" r="1.7" fill="currentColor"/><circle cx="14.3" cy="14.7" r="1.7" fill="currentColor"/></svg>
        <span>Accords</span>
      </button>
      <button class="tab" data-tab="exercises" role="tab">
        <svg viewBox="0 0 24 24"><path d="M8 21h8l-1.6-15a2.4 2.4 0 00-4.8 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 17l4-11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16.3" cy="5" r="1.6" fill="currentColor"/></svg>
        <span>Exercices</span>
      </button>
      <button class="tab" data-tab="songs" role="tab">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Morceaux</span>
      </button>
      <button class="tab" data-tab="tuner" role="tab">
        <svg viewBox="0 0 24 24"><path d="M3.5 16a8.5 8.5 0 0117 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 16l3.6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16" r="1.8" fill="currentColor"/><path d="M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Accordeur</span>
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data/chords.js"></script>
  <script src="data/exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
